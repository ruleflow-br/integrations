version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"

  - package-ecosystem: "npm"
    directory: "/examples/node"
    schedule:
      interval: "weekly"
      day: "monday"

  - package-ecosystem: "gomod"
    directory: "/examples/go"
    schedule:
      interval: "weekly"
      day: "monday"

  - package-ecosystem: "cargo"
    directory: "/examples/rust"
    schedule:
      interval: "weekly"
      day: "monday"
    # ureq 3.x is a breaking major that the example is not written for; keep it
    # on 2.x and still receive minor/patch updates.
    ignore:
      - dependency-name: "ureq"
        update-types: ["version-update:semver-major"]
