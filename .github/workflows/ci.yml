name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  baseline:
    name: repository baseline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: README present
        run: test -s README.md && echo "baseline OK"
      - name: validate shared fixtures (jq)
        run: |
          for f in examples/shared/*.json; do
            echo "checking $f"
            jq empty "$f"
          done
          echo "shared fixtures OK"

  python:
    name: python (compile check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: py_compile examples/python/main.py
        run: python -m py_compile examples/python/main.py

  node:
    name: node (syntax check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: node --check examples/node/index.mjs
        run: node --check examples/node/index.mjs

  go:
    name: go (fmt + vet)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.21"
      - name: gofmt
        run: |
          cd examples/go
          fmt_out="$(gofmt -l .)"
          if [ -n "$fmt_out" ]; then
            echo "gofmt found unformatted files:"
            echo "$fmt_out"
            exit 1
          fi
      - name: go vet
        run: cd examples/go && go vet ./...

  curl:
    name: curl script (syntax check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: bash -n examples/curl/run.sh
        run: bash -n examples/curl/run.sh

  rust:
    name: rust (build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo build --locked
        run: cd examples/rust && cargo build --locked

  ruby:
    name: ruby (syntax check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - name: ruby -c examples/ruby/main.rb
        run: ruby -c examples/ruby/main.rb

  php:
    name: php (lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
      - name: php -l examples/php/main.php
        run: php -l examples/php/main.php

  c:
    name: c (compile check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: install libcurl dev headers
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev
      - name: gcc examples/c/main.c -lcurl
        run: gcc examples/c/main.c -lcurl -o /tmp/rf_c
